services:
  mongodb:
    image: mongo:7.0
    container_name: resume-builder-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: resume-builder
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: resume-builder-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/resume-builder
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEVORA21_API_KEY: ${DEVORA21_API_KEY}
      DEVORA21_SCRAPE_URL: ${DEVORA21_SCRAPE_URL:-https://api.devora21.com/jobs/scrape}
      CHROMIUM_PATH: ${CHROMIUM_PATH:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_config:
