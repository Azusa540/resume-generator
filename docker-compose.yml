# Production stack — app only. Database is MongoDB Atlas (MONGODB_URI in .env).
services:
  app:
    build: .
    container_name: resume-builder-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEVORA21_API_KEY: ${DEVORA21_API_KEY}
      DEVORA21_SCRAPE_URL: ${DEVORA21_SCRAPE_URL:-https://api.devora21.com/jobs/scrape}
      CHROMIUM_PATH: ${CHROMIUM_PATH:-/usr/bin/chromium-browser}
      B2_BUCKET: ${B2_BUCKET}
      B2_ENDPOINT: ${B2_ENDPOINT}
      B2_REGION: ${B2_REGION}
      B2_KEY_ID: ${B2_KEY_ID}
      B2_APP_KEY: ${B2_APP_KEY}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
